<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cf6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SPK Tracker">
  <title>SPK Tracker</title>
  <link rel="manifest" href="manifest.json?v=3">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1wAhWMqWGlbOe8ifPh9MPTsAF6_vhBLVu=w192">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1wAhWMqWGlbOe8ifPh9MPTsAF6_vhBLVu=w192">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;overflow:hidden;background:#2b6cf6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    iframe{border:0;width:100%;height:100%;display:block;position:fixed;inset:0;background:#0f172a}
    #loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2b6cf6;color:#fff;z-index:10;transition:opacity .4s}
    #loader.hide{opacity:0;pointer-events:none}
    #loader .logo{width:80px;height:80px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-weight:800;color:#2b6cf6;font-size:26px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15)}
    #loader .logo img{width:100%;height:100%;object-fit:cover;display:block}
    #loader h1{font-size:20px;font-weight:700;margin-bottom:6px}
    #loader p{font-size:13px;opacity:.85}
    .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-top:20px}
    @keyframes spin{to{transform:rotate(360deg)}}
    #error{position:fixed;inset:0;background:#0f172a;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:20}
    #error h2{font-size:18px;margin-bottom:10px;color:#ef4444}
    #error p{font-size:13px;color:#94a3b8;line-height:1.6;max-width:380px}
    #error button{margin-top:20px;padding:10px 20px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
    #updateBar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:30;background:#16a34a;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none;cursor:pointer}
    #updateBar.show{display:block}
    #updateBar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:30;
  background:#16a34a;color:#fff;padding:10px 20px;border-radius:24px;
  font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);
  display:none;cursor:pointer;white-space:nowrap;
}
#updateBar.show{display:block}
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo">
      <img src="https://lh3.googleusercontent.com/d/1wAhWMqWGlbOe8ifPh9MPTsAF6_vhBLVu=w192" alt="SPK Tracker" onerror="this.style.display='none';this.parentNode.textContent='SPK'">
    </div>
    <h1>SPK Tracker</h1>
    <p>Memuat aplikasi…</p>
    <div class="spinner"></div>
  </div>

  <div id="error">
    <h2>⚠️ Gagal Memuat</h2>
    <p id="errorMsg">Tidak bisa terhubung ke server. Pastikan internet kamu aktif lalu coba lagi.</p>
    <button onclick="location.reload()">🔄 Muat Ulang</button>
  </div>

  <div id="updateBar" onclick="window.__spkForceReload && window.__spkForceReload()">🎉 Versi baru tersedia — ketuk untuk muat ulang</div>

  <iframe id="appFrame"
          src="https://script.google.com/macros/s/AKfycbzD2qL5jbN7qdAwPGyw1w17oU7LO-43gTyiQGFNHyz5WQBwfgqX2Mt1gEbYS9iuHHbOVA/exec"
          allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; geolocation"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-top-navigation-by-user-activation">
  </iframe>

  <script>
    (function(){
      var APP_VERSION = '4';

      // ===== Loader handler =====
      var frame = document.getElementById('appFrame');
      var loader = document.getElementById('loader');
      var error = document.getElementById('error');
      var errorMsg = document.getElementById('errorMsg');

      var loadTimeout = setTimeout(function(){
        var p = loader.querySelector('p');
        if (p) p.textContent = 'Masih memuat… Koneksi mungkin lambat.';
      }, 12000);

      frame.addEventListener('load', function(){
        clearTimeout(loadTimeout);
        loader.classList.add('hide');
        setTimeout(function(){ loader.style.display = 'none'; }, 500);
      });

      frame.addEventListener('error', function(){
        clearTimeout(loadTimeout);
        loader.style.display = 'none';
        error.style.display = 'flex';
      });

      setTimeout(function(){
        if (!loader.classList.contains('hide') && loader.style.display !== 'none') {
          loader.style.display = 'none';
          error.style.display = 'flex';
          errorMsg.textContent = 'Halaman lama tidak merespons. Cek koneksi atau buka ulang.';
        }
      }, 30000);

      // ===== Service Worker + Auto-Update =====
      if ('serviceWorker' in navigator) {
        var refreshing = false;
        var updateBar = document.getElementById('updateBar');

        function forceReload(){
          var sw = navigator.serviceWorker.controller;
          if (sw) sw.postMessage({ type: 'SKIP_WAITING' });
          setTimeout(function(){ location.reload(); }, 200);
        }
        window.__spkForceReload = forceReload;

        window.addEventListener('load', function(){
          navigator.serviceWorker.register('sw.js?v=' + APP_VERSION, {
            scope: './',
            updateViaCache: 'none'
          })
            .then(function(reg){
              // Cek update SEKARANG saat boot
              reg.update().catch(function(){});

              // ★ Cek update tiap 5 MENIT (bukan 30 menit)
              setInterval(function(){ reg.update().catch(function(){}); }, 5 * 60 * 1000);

              // Deteksi SW baru
              reg.addEventListener('updatefound', function(){
                var newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function(){
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // SW baru siap → tampilkan banner
                    if (updateBar) updateBar.classList.add('show');
                  }
                });
              });

              // Kalau sudah ada SW waiting dari sesi sebelumnya → tampilkan banner
              if (reg.waiting) {
                if (updateBar) updateBar.classList.add('show');
              }
            })
            .catch(function(){});

          // ★ Cek update saat PWA kembali ke foreground (mobile-friendly)
          document.addEventListener('visibilitychange', function(){
            if (document.visibilityState === 'visible') {
              navigator.serviceWorker.getRegistration().then(function(reg){
                if (reg) reg.update().catch(function(){});
              }).catch(function(){});
            }
          });

          // Kalau controller berubah (SW baru ambil alih), reload otomatis
          navigator.serviceWorker.addEventListener('controllerchange', function(){
            if (refreshing) return;
            refreshing = true;
            location.reload();
          });
        });
      }
    })();
  </script>
</body>
</html>
